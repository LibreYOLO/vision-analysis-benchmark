name: RF100-VL campaign image

# Builds the campaign image in CI rather than on a laptop: the image is ~10 GB
# and a home upload link would take longer to push it than the runner takes to
# build and push it inside the GitHub/GHCR network.
on:
  workflow_dispatch:
    inputs:
      libreyolo_ref:
        description: LibreYOLO commit SHA to pin (full 40 chars)
        required: true
        default: 19b9321ab11450f9d9569ca059e2346267a51aca
      tag:
        description: Image tag to publish
        required: true
        default: dev
  push:
    paths:
      - deploy/Dockerfile
      - deploy/freeze_torch.py
      - deploy/verify_image.py
      - .github/workflows/benchmark-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A CUDA torch image plus our layers overruns the runner's stock free
      # space; these caches are worth ~25 GB and nothing here uses them.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/libreyolo/rf100vl-bench:${{ inputs.tag || 'dev' }}
          build-args: |
            LIBREYOLO_REF=${{ inputs.libreyolo_ref || '19b9321ab11450f9d9569ca059e2346267a51aca' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
