name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Audit wheel package data
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          unzip -l wheelhouse/*.whl | grep -q "va_bench/data/rf100vl_domains.json"
